name: Deployment checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: watchlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python run_tests.py
      - name: PostgreSQL transaction integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/watchlist_test?sslmode=disable
        run: python tests/postgres_integration.py
      - run: docker build --build-arg INSTALL_BROWSER=false -t watchlist:test .
      - run: docker run --rm watchlist:test python run_tests.py
