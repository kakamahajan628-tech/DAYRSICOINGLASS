name: Weekly encrypted database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 0'
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    container: postgres:19-bookworm
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install backup-only runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv ca-certificates
          python3 -m venv /tmp/backup-env
          /tmp/backup-env/bin/pip install 'cryptography>=46,<51' 'SQLAlchemy>=2.0,<2.1' 'psycopg[binary]>=3.2,<4'
      - name: Create encrypted backup and validate archive
        run: /tmp/backup-env/bin/python backup.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-postgres-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
      - name: Record successful external upload
        run: /tmp/backup-env/bin/python backup.py --record-upload 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
